- addr: 0x79a440
  final: 0x5237a0
  kind: function
  name: the unit efficiencies job
  semantics: "the unit efficiencies job (\"Could not find a neutral player\"): per pair of Units rows both without strength (max(Combat, RangedCombat, Bombard) 0 and AntiAirCombat 0) 1.0; one without against one with 0.01 / 100.0; else two combat simulations (0x205720) of the neutral player's units, each attacking the other: the damage each takes in both, 100 / damage the exchanges to kill, a range advantage ((Range - 1) / the other's moves, rounded up) added where the domains match, AntiAirCombat terms against air; M[a][b] = a's exchanges-to-die over b's. Logged once a game as AI_UnitEfficiency.csv (\", %3.2f\"). The neutral player's units are allocated off the map (0x4eeb70 with plot -1, -1: no terrain, full health); the diagonal 1.0 (0x79a7c5); per pair of Units rows i < j (the inner loop from i + 1, 0x79a8b7) a row is weak where max(Combat +0x48, RangedCombat +0x6c, Bombard +0x40) is 0 and AntiAirCombat +0x34 not above 0: i weak and j strong M[i][j] 0.01 (raw 2: floor 0 | trunc(0.01 x 256)) and M[j][i] 100.0; i strong and j weak M[i][j] 100.0 and M[j][i] 1.0 (0x79a9fd); both weak 1.0 both ways (0x79a95e). Two strong rows: two simulations (0x205720, flag set: the damage law's expectation), i on j (+0xf80) and j on i (-0x30); per unit its damage over both (+0x7c attacker / +0xc4 defender words, << 8, at least 1.0), its exchanges 0x640000 / damage (24.8, truncated). The range term (0x79ab16..0x79abeb): the earlier row's ceil((Range - 1) / the other's BaseMoves +0x38) where its Range +0x68 is above the other's and at least the other's moves, else the later row's ceil((Range - 1) / the earlier's moves) where its Range is at least those moves; neither where the two differ both in AntiAirCombat > 0 and in being air units (0x79aafa: 0xadd590 == 1, DOMAIN_AIR); the term << 8 added to that unit's exchanges; M[i][j] = (ex_i << 8) / ex_j, M[j][i] the other way (0x79af67, 0x79b064), truncated. The anti-air term (0x79b115..0x79b63f): i holding AntiAirCombat against an air j, t = AntiAirCombat << 8 x 0.05 (raw 12) >> 8; M[j][i] -= min(t, M[j][i]) and M[i][j] += max(M[i][j], t) (the cmovge picks); else j holding it against an air i, the same with the entries swapped. Both units are the neutral player's, so every COLLECTION_UNIT_COMBAT EFFECT_ADJUST_PLAYER_STRENGTH_MODIFIER of either unit whose requirements hold (PLAYER_IS_ATTACKING met, the opponent the defender) counts for the attacker: the Berserker's +10, the Redcoat's +10, the Digger's +5 raise its attack and its attacker's on it; ANTI_SPEAR / ANTI_CAVALRY count for the attacker alone; the Carolean's per-unused-Movement term +3 x 3 BaseMoves both ways; REQUIREMENT_OPPONENT_IS_STRONGER met where the defender's Combat tops the attacker's (a fit on its 19 pairs, the requirement's code unread). Ported: unitEfficiency (cpu/core/aiUnitEfficiency.ts), rules.unitEfficiency (GPU). At 0x79b8a0: the unit production table's log: row r, column c printed as data[width x r + c]."
