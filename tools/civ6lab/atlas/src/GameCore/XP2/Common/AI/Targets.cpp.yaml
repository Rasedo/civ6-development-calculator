  kind: function
  semantics: "the targets update after the ageing and the look in 0x785f30; writes AI_Knowledge.csv's lines (0x7858b7 -> 0x5ed280 -> 0x5eceb0). The target list: the plots in index order, a plot the player sees (+0x290 > 0) giving, by its district (0x810d0): the player's own FRIENDLY_CITY; an ally's (0x3da560) ALLY_SUPPORT; a player's at war (0x469cd0) COMBAT_DISTRICT where it defends (0x24c2f0), then nothing else of the plot, and PASSIVE_DISTRICT where it counts toward the limit (0x527e30), complete (+0xb08) and not pillaged (0x24c3a0); else NEUTRAL_CITY; each where the player's type flags (+0xb0) take it. Else its defender (0x208b80) LOW (an aircraft AIR_UNIT); else a CAMP, a goody hut, a Trader at war (one entry each), the plot's one civilian (CIVILIAN at war, else NEUTRAL_CIVILIAN; a fighter in that layer LOW), its religious unit, an unpillaged improvement of a player at war. A plot only revealed gives its camp, goody hut, improvement and districts. Then 0x786d50, and the player's priorities hook (+0xa8). Gathers into a set every region of a plot its player sees (+0x290 count above 0, 0x783d5c) or revealed (+0x2f0, 0x7852db), plots off any region left out; stored as the tertiary region list (0x6fad50, ascending) after its plot walk. At 0x7856f6: after its plot walk and the region set the target list walks the game's players (0x483b50 +0x4a0..+0x4a8) and, for each its player is at war with (0x469cd0), asks its knowledge base (0x786160) for that player's units (0x5eb8b0, age 1, distance 2); each such plot the player does not see now (+0x290 count 0) takes an entry after the walk's: TARGET_LOW_PRIORITY_UNIT where the unit's type has Combat (+0x48), else TARGET_CIVILIAN_UNIT; the priorities (0x786d50) follow. Ported: knowledgeEntries / _tac_known_entries (a plot holds one unit entry on the GPU, a LAB). The unit chain of a plot seen, by three layer lists (0x75ce0): a trade layer not empty ends the chain (0x7849bb..0x784c2b), each Trader of another player at war with a route and not immune a TRADER; else a units' layer of exactly one unit of another player ends it (0x784c30..0x784c5f), that unit by its formation class (0x8bcd0) 2 a CIVILIAN at war (NEUTRAL_CIVILIAN at peace), 1 (support) a LOW at war (0x784e34..0x784e6d), any other none; a layer of another count or the player's own one unit goes on to the religious layer (0x784f5c) and the improvement."
