  semantics: "Move Unit's update: its kept unit (+0x50, kept across turns; an id of 0 or -1 none) alive with a planning: SUCCESS where the planning reaches the location within one turn (0x791300, the flag clear), else RUNNING. None kept: over its units in order, the first reaching it this turn with Movement left (the flag set) is kept and it SUCCEEDS; else the first reaching it this turn, where none is kept yet, or the one whose path (0x272a60) takes the fewest turns, is kept, RUNNING; none FAILURE. \"Allow Danger\" 0 (every city tree's): the location read on the player's danger map (0x7f040d: 0x716a60 on player +0x12d8, x + y x width into 0x716a90); a location of danger lets the kept unit that reaches it go (+0x50 -1, SUCCESS), and a unit is kept by its path only where the location is clear (0x7f057e). With no Location (0x7f067c) SUCCESS where every tree unit with a target is done. No Location SUCCESS, no unit SUCCESS; the unit it holds (the node's memory): its planning reaching a plot at To Range of the location this turn (0x791300) SUCCESS, else RUNNING, a held unit with no planning FAILURE; none held, the unit whose planning reaches the location this turn — one with Movement left there first —, else the one whose path (0x272a60 on the unit's path finder +0x1fb8, flag 0x1000, at 0x7f05a0) takes the fewest turns (above 0, fewer than the best so far) is held: SUCCESS where it reaches it with Movement left, else RUNNING; none FAILURE. A camp its own defender holds is such a goal. With no Location (from 0x7f067c): over the tree's units, each with a target (+0x830) reaching it within a turn with Movement left (0x791300) or whose target holds danger (0x716a60, Allow Danger false) passes; one with no planning (+0x1fc0) or none reaching it RUNNING, else SUCCESS."
