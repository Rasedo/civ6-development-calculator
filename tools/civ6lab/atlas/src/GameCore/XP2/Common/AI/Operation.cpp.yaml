  semantics: "the team update (from 0x73f7d0; goals at team +0xe8 + 8 x slot): per member its axial column and row summed; per tactical target (kb +0x370) within twice its base Movement (0x56d9f0): the team's attack strength (+0x98) once per member that can strike it (0x791300), the damage the target would deal it (0x51a240 / 0x519370 under the danger map), the target into the team's list (+0xb8) and the enemy strength (+0x94); a member the expected damage would kill is endangered (+0xa0). Then slot 3 (+0x100) the centre; slot 5 (+0x110) the march point — the enemy not at war: from the target back toward the rally in single-precision axial steps (0x38070), the first plot P may enter (its own, no one's, open borders / alliance 0x3dab70, or an owner not enforcing its borders, diplomacy +0x6c0), the rally where reached; no enemy or at war: the target; with targets slot 4 (+0x108) the battle line, halfway between the centre and the targets' average, the team engaged (+0x90). Logged \"Battle line, %d:%d, %d endangered\". The endangered list (+0xa0, cleared each tick): a unit entry that fights adds its blow where no unit of the member's player stands on its ring (0x6b1b0 over 0x737610) and the member's plot holds danger or the entry is HIGH; a district entry (kind COMBAT or PASSIVE DISTRICT, component type 3) is the district (0x408770), its strike 0x249ee0 with no flag (0 unless its perimeter stands, no damage term) above 0, the member within its reach 0x249e40 of the district's own plot (+0x158 / +0x15c), 0x519370's blow; a member joins where the sum is above 0 and it does not fight (a lone unit on land: its formation of one unit, +0x1fb8 -> +0x738 at 1, and its plot's count +0x4c at 1, 0x739659..0x739675), else where its damage plus the sum passes its hit points — a captive in its escort's formation is never listed."
