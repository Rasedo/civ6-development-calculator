  semantics: "the unit location test: refuses a plot for its terrain (impassable, the unit's domain), another player's closed borders, a unit type that needs a district off one, or a hostile defender there (0x208b80) — never for the owner's own units. The domain test reads the unit's domain (+0x650; DOMAIN_SEA 0, DOMAIN_LAND 2): a sea unit stands on water, on a plot not of water only where a district stands (plot virtual +0x40) whose info word +0x14 carries the water bit (0x81240 argument 0, bit 1); a land unit the same with the land bit (argument 2, bit 4) on water it may not embark onto. A City Centre's word answers both: a hull stands on its centre. With flag 0x10 (refused) or 0x20 (always) it answers 2 where FindAlternateLocation finds a plot within 10 (out-parameter that plot), 1 where the plot takes the unit (out-parameter the plot), 0 else; FindAlternateLocation reads it as nonzero = may enter (0x585ba5). The district test (0x5866c9..0x58671f): on a plot of another player at war holding a district of hit points (0x57cf0 -> 0x24c2f0), refused for a unit whose ranged strength (0x56e3e0) or bombard strength (0x56daa0) tops its combat strength (0x56dc90), or under flag 0x40; else for a unit that fights (0x209dd0) refused unless flag 1. Ported: groundOf's attack (shoots), _tac_search's fort_w. Under flag 1 (a path node's location bit, 0x271be0) the district test refuses a fighting unit no plot: a move order's path takes a district of hit points at war the player does not see now as a plain node (groundOf's pass, _tac_search's fort_u)."
