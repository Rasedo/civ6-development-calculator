- addr: 0x586360
  final: 0x3b08e0
  kind: function
  semantics: "the unit location test: refuses a plot for its terrain (impassable, the unit's domain), another player's closed borders, a unit type that needs a district off one, or a hostile defender there (0x208b80) — never for the owner's own units. The domain test reads the unit's domain (+0x650; DOMAIN_SEA 0, DOMAIN_LAND 2): a sea unit stands on water, on a plot not of water only where a district stands (plot virtual +0x40) whose info word +0x14 carries the water bit (0x81240 argument 0, bit 1); a land unit the same with the land bit (argument 2, bit 4) on water it may not embark onto. A City Centre's word answers both: a hull stands on its centre. With flag 0x10 (refused) or 0x20 (always) it answers 2 where FindAlternateLocation finds a plot within 10 (out-parameter that plot), 1 where the plot takes the unit (out-parameter the plot), 0 else; FindAlternateLocation reads it as nonzero = may enter (0x585ba5)."
