- addr: 0x58b1d0
  final: 0x3b4650
  kind: function
  name: unitSightList
  signature: "void unitSightList(?, int range, int x, int y, bool seeThroughFeatures, bool seeThroughTerrain, Vector<(int plot, int ring)>* out)"
  semantics: |
    A unit's line of sight: the (plot index, ring) list an eye on (x, y)
    sees out to `range`. A per-plot int array (map width x height, zeroed)
    holds each plot's carried height. The walk goes ring 0 .. range + 1 in
    axial steps (dq, dr) (0,1) (1,0) (1,-1) (0,-1) (-1,0) (-1,1) (0xeff670 /
    0xeff688): each ring from one step in direction 0 past the last ring's
    end, direction 1, turning to the next direction (0xeff6a0) where a step
    leaves the ring. The eye's plot is listed (ring 0, carried 0). Each
    other plot on the map: its two parents are the neighbours in the
    directions the six-way switch names for the direction it was reached by
    ((1,2) (3,2) (3,4) (4,5) (5,0) (1,0)), a parent counting only on the
    map at hex distance ring - 1 from the eye (0x58ae50); its own height is
    0x58d1c0 (terrain SightThroughModifier +0x34 unless seeThroughTerrain,
    feature SightThroughModifier +0x44 unless seeThroughFeatures; 0 on ring
    range + 1). A parent's carried value >= 0x1000000 is SPLIT (the bit
    dropped). With one parent, equal values or a split one, the unsplit
    parent carries (the first by default); else the line from the eye's
    centre to the plot's (24.8 fixed point, x * 256 plus 128 on an odd row,
    y * 256, the coordinates as wrapped) picks the parent nearer by more
    than 0.05 (12), both within it: the lower carries and the plot is
    stored max(lower, own) + 0x1000000 when the higher exceeds its own,
    else its own. One carrying parent: stored max(own, parent). Listed when
    the carrying parent's value is below its own, or no higher than the
    eye (0x58af70: the terrain's SightModifier +0x30, 1 on a city centre or
    a complete, unpillaged district with ZOC and HitPoints, 0x24c2f0) and
    the ring is not range + 1.
  status: READ
  cases:
