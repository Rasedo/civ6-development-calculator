- addr: 0x351fc0
  kind: function
  name: Game_Techs
  semantics: "the random Future tree of the techs, at the game's set-up (0xa56500 via 0x353df0). Per tech in table order (0xad6490): its Cost (+0x1c) joins the cost levels (40-byte entries {cost << 8, rows}); a tech with TechnologyRandomCosts rows (0xad64b0, matched on +0x18) draws one of those whose level holds fewer than 7 rows (0x3521d7) uniformly through the picker 0x152eb0 (\"Choosing a random cost for a tech to have\", range their count). The levels sorted by cost (0x351000); per level the candidates are the rows of the nearest lower level holding any (0x352850 walk), weight 100 (0x3528de). Per row of the level with Technologies_XP2 RandomPrereqs (+0x28 bit 2): count = ceil(candidates / the level's rows) in 24.8 (0x352bc8..0x352c1a), 0x8b6c10 over it (\"Choosing how many prerequisites for a tech to have\"), plus 1, at least 1, at most the candidates; that many weighted picks 0x353070 (\"Choosing a random prerequisite for a tech to have\"), each added to the node's list (+0x10) once and its weight set to 1 (0x354000). Any other row copies its TechnologyPrereqs pairs (+0x148)."
  status: READ
  cases:
