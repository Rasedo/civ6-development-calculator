  semantics: "The XP2 UPGRADE command (its object 0xa49bb0, vtable @0xdb4370 slot 4; UNITCOMMAND_UPGRADE 0x9576d0), over the old unit (rdx): reads its owner (+0x2e0), id (+0x100), the upgrade type (0x5909a0), its formation (+0xc90), experience record (+0x1bc0: points 0x135e90, level 0x382f0, the promotion flag 0x116f80, 0x55e4a0's fixed value), name (+0x1be0), damage (+0xcf0), plot (+0x220 / +0x224), +0x890, +0x5f0, +0x340, its abilities (0x56d800) and the Gold (0x590520); the units manager's destroy (vt +0x60, 0x941130) with r8b 1 takes the old unit — the delayed kill (0x4ef040, as the manager's kill 0x9402a0 reads the flag), the old unit standing in its slot to its player's end of turn; its create (vt +0x50) makes a unit of the upgrade type on the plot. The new unit pays the Gold (<< 8, 0x4e02e0), takes the embarked state (0x5706e0), the name, the damage (SetDamage), the formation (SetMilitaryFormation), the level (0x55edf0), the experience (ChangeExperience), 0x55dc00, +0x890 (0x570870), +0x340 (0x1e60f0 on +0x2e8), the promotion flag, every promotion held (HasPromotion / SetPromotion over the level's count), the abilities whose row flag 2 is set and it lacks (0x56e4c0, 0x56bf50), its ObjectPairingManager (@0xf07400) entry re-keyed to it (0x9297f0 -> 0x9293b0); then its Movement 0 (0x56d6f0), its turn ended (0x570b40 dl 1), for a FULL_CIV the upgrade's strategic resource (Units +0x2c8, ChangeResourceAmount), the player's stats (0x4c1b20) and UnitUpgraded (0x4b7440e9) with the new id. Nothing writes its fortification, its assignment (+0x7d0) or its home: the unit's init's (0x563cd0)."
