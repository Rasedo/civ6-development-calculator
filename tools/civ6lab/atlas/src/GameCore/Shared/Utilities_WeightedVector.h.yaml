- addr: 0x7154f0
  kind: function
  name: weightedVectorAdd
  semantics: appends an entry (the item's 8 bytes and its weight, 12 bytes) to a weighted vector (+0x20 data, +0x28 capacity, +0x30 count), asserting the weight is not negative; it sorts nothing and sums nothing.
